[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-toolkit"
description = "人事 Excel 自动化工具箱"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dynamic = ["version"]
dependencies = [
    "certifi>=2024.8.30",
    "openpyxl>=3.1,<4",
    "py7zr>=1.0,<2",
    "pypdf[image]>=6.16.1,<7",
    "xlrd>=2.0,<3",
    "unrar2-cffi>=0.4.1,<0.6",
    'rapidocr_onnxruntime>=1.3.0; python_version < "3.13"',
    'rapidocr==3.9.2; python_version >= "3.13"',
    'onnxruntime==1.29.0; python_version >= "3.13"',
    'pywin32>=306; platform_system == "Windows"',
]

[project.scripts]
hr-toolkit = "hr_toolkit.cli:main"

[project.optional-dependencies]
gui = [
    'PySide6_Essentials==6.6.3.1; python_version >= "3.9" and python_version < "3.13"',
    'PySide6_Essentials==6.11.2; python_version >= "3.13"',
    'PySide2==5.15.2.1; python_version < "3.9" and platform_system == "Windows"',
]

[tool.setuptools.packages.find]
include = ["hr_toolkit*"]

[tool.setuptools.package-data]
"hr_toolkit.templates" = ["*.xlsx"]
"hr_toolkit.gui_qt" = ["qml/*.qml", "qml/components/*.qml"]

[tool.setuptools.dynamic]
version = { attr = "hr_toolkit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["*Test", "*Tests"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
