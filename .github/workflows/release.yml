name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/python312-production.txt

      - name: Require exact v<SemVer> tag and matching project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/generate_release_metadata.py \
            --version "${VERSION}" \
            --tag "${GITHUB_REF_NAME}" \
            --check-only
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -c constraints/python312-production.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run complete unit test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Compile all Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hr-toolkit-pycache
        run: python -m compileall -q -f hr_toolkit scripts tests hr_toolkit_app.py hr_toolkit_qt_app.py hr_toolkit_updater.py

      - name: Check tagged commit whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  build-windows:
    name: Build Windows EXE and MSI
    needs: validate
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PYTHONUTF8: "1"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-gui.txt
            constraints/python312-production.txt

      - name: Install Python build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt -c constraints/python312-production.txt
          python -m pip check

      - name: Exercise local OCR models and inference
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test; ocr_runtime_smoke_test()"

      - name: Install Inno Setup and WiX
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Windows tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build application, installers, and update assets
        run: >-
          python scripts/release_windows.py
          --version "${{ env.VERSION }}"
          --build-dir dist/windows
          --output-dir artifacts/windows

      - name: Verify deterministic Windows asset names
        shell: pwsh
        run: |
          $expected = @(
            "artifacts/windows/HRToolkit_${env:VERSION}_x64-setup.exe",
            "artifacts/windows/HRToolkit_${env:VERSION}_x64.msi"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release asset: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Empty release asset: $path"
            }
          }

      - name: Upload direct Windows assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-windows
          path: |
            artifacts/windows/HRToolkit_${{ env.VERSION }}_x64-setup.exe
            artifacts/windows/HRToolkit_${{ env.VERSION }}_x64.msi
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload legacy server bridge manifest for operations
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: legacy-server-bridge
          path: artifacts/windows/legacy-server-latest.json
          if-no-files-found: error
          retention-days: 90

  build-windows-win7:
    name: Build Windows 7 SP1 compatibility EXE and MSI
    needs: validate
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PYTHONUTF8: "1"
      HR_TOOLKIT_7ZIP_EXE: ${{ github.workspace }}\build\win7-runtime\7zip\7z.exe
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.8 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-win7.txt
            requirements-build.txt
            requirements-gui.txt
            constraints/python38-win7.txt

      - name: Install frozen Win7 build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==25.0.1"
          python -m pip install --disable-pip-version-check -r requirements-win7.txt -r requirements-build.txt -c constraints/python38-win7.txt
          python -m pip check

      - name: Prepare pinned 7-Zip and app-local UCRT
        run: python scripts/prepare_win7_runtime.py --output-dir build/win7-runtime

      - name: Exercise Win7-compatible OCR and archive runtimes
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test, smoke_test; ocr_runtime_smoke_test(); smoke_test()"

      - name: Install Inno Setup and WiX
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Python 3.8-compatible core tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest -v
          tests.test_archive_import
          tests.test_data_statistics
          tests.test_project_store
          tests.test_runtime_checks
          tests.test_salary_merge
          tests.test_salary_split
          tests.test_social_security
          tests.test_tool_registry
          tests.test_paths
          tests.test_release_metadata
          tests.test_background_process
          tests.test_qt_controller
          tests.test_qt_entrypoint
          tests.test_qt_form_specs
          tests.test_run_coordinator

      - name: Build and statically audit Win7 compatibility assets
        run: >-
          python scripts/release_windows.py
          --version "${{ env.VERSION }}"
          --target win7
          --seven-zip-dir build/win7-runtime/7zip
          --ucrt-dir build/win7-runtime/ucrt
          --vc-runtime-dir build/win7-runtime/vc-runtime
          --build-dir dist/windows-win7
          --work-dir build/windows-win7
          --output-dir artifacts/windows-win7

      - name: Verify deterministic Win7 asset names
        shell: pwsh
        run: |
          $expected = @(
            "artifacts/windows-win7/HRToolkit_${env:VERSION}_win7_x64-setup.exe",
            "artifacts/windows-win7/HRToolkit_${env:VERSION}_win7_x64.msi"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Win7 release asset: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Empty Win7 release asset: $path"
            }
          }

      - name: Upload direct Win7 assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-windows-win7
          path: |
            artifacts/windows-win7/HRToolkit_${{ env.VERSION }}_win7_x64-setup.exe
            artifacts/windows-win7/HRToolkit_${{ env.VERSION }}_win7_x64.msi
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Win7 bridge manifest for operations
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: legacy-server-bridge-win7
          path: artifacts/windows-win7/legacy-server-latest-win7.json
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Build verified macOS ${{ matrix.asset_suffix }} DMG
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            asset_suffix: x64
          - runner: macos-15
            architecture: arm64
            asset_suffix: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-gui.txt
            constraints/python312-production.txt

      - name: Confirm native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install macOS build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt -c constraints/python312-production.txt
          python -m pip check

      - name: Prepare compact Intel macOS runtime
        if: matrix.architecture == 'x86_64'
        run: python scripts/prepare_macos_x64_runtime.py

      - name: Exercise local OCR models and inference
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test; ocr_runtime_smoke_test()"

      - name: Build and verify native app and DMG
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_macos.py \
            --version "${VERSION}" \
            --architecture "${{ matrix.architecture }}" \
            --output-dir artifacts/macos

      - name: Upload verified architecture DMG
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-macos-${{ matrix.asset_suffix }}
          path: artifacts/macos/HRToolkit_${{ env.VERSION }}_${{ matrix.asset_suffix }}.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish GitHub Release direct assets
    needs:
      - validate
      - build-windows
      - build-windows-win7
      - build-macos
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-windows-win7.result == 'success' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download successful platform artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate unified latest.json and SHA256SUMS.txt
        run: >-
          python scripts/generate_release_metadata.py
          --version "${VERSION}"
          --tag "${TAG}"
          --repository "${GITHUB_REPOSITORY}"
          --assets-dir release-assets
          --notes "HR Toolkit v${VERSION}"

      - name: Create or reuse a draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --json isDraft > "${RUNNER_TEMP}/release-state.json" 2>/dev/null; then
            python - "${RUNNER_TEMP}/release-state.json" <<'PY'
          import json
          import sys
          state = json.load(open(sys.argv[1], encoding="utf-8"))
          if not state.get("isDraft"):
              raise SystemExit("Refusing to modify an already-published release")
          PY
          else
            gh release create "${TAG}" \
              --draft \
              --verify-tag \
              --title "HR Toolkit ${TAG}" \
              --generate-notes
          fi

      - name: Upload files as direct GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          # A retried failed run may reuse its own draft. Remove only assets
          # from that verified draft so stale names cannot block the exact
          # allowlist check.
          while IFS= read -r asset_name; do
            if [[ -n "${asset_name}" ]]; then
              gh release delete-asset "${TAG}" "${asset_name}" --yes
            fi
          done < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
          while IFS= read -r -d '' asset; do
            gh release upload "${TAG}" "${asset}" --clobber
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)

      - name: Verify draft asset names and sizes
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json isDraft,assets > "${RUNNER_TEMP}/release-assets.json"
          python - "${RUNNER_TEMP}/release-assets.json" release-assets <<'PY'
          import json
          import sys
          from pathlib import Path

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {path.name: path.stat().st_size for path in Path(sys.argv[2]).iterdir() if path.is_file()}
          actual = {asset["name"]: asset["size"] for asset in state.get("assets", [])}
          if not state.get("isDraft"):
              raise SystemExit("Release became public before asset verification")
          if actual != expected:
              raise SystemExit(f"Release assets mismatch: expected={expected}, actual={actual}")
          PY

      - name: Publish the fully verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --draft=false --latest
          test "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "false"

  mirror-gitee:
    name: Publish Gitee source release and checksum
    needs:
      - validate
      - publish
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ github.ref_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITEE_REPOSITORY: optimistic-little-sunspot/hr-toolkit
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Require Gitee sync credential
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "Missing required GitHub Actions Secret: GITEE_TOKEN" >&2
            exit 1
          fi

      - name: Download and validate checksum metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p gitee-release-metadata
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "SHA256SUMS.txt" \
            --dir gitee-release-metadata
          python scripts/publish_gitee_release.py \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --repository "${GITEE_REPOSITORY}" \
            --target-commitish "$(git rev-parse "${TAG}^{commit}")" \
            --assets-dir gitee-release-metadata \
            --source-metadata-only \
            --dry-run

      - name: Fast-forward source and annotated tag to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: optimistic-little-sunspot
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          ASKPASS_PATH="${RUNNER_TEMP}/gitee-askpass.sh"
          cat > "${ASKPASS_PATH}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "${GITEE_USERNAME}" ;;
            *Password*) printf '%s\n' "${GITEE_TOKEN}" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "${ASKPASS_PATH}"
          export GIT_ASKPASS="${ASKPASS_PATH}"

          git remote add gitee "https://gitee.com/${GITEE_REPOSITORY}.git"
          git fetch gitee refs/heads/main:refs/remotes/gitee/main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          git merge-base --is-ancestor refs/remotes/gitee/main "${TAG_COMMIT}"

          REMOTE_TAG="$(git ls-remote gitee "refs/tags/${TAG}" | awk '{print $1}')"
          LOCAL_TAG="$(git rev-parse "refs/tags/${TAG}")"
          if [[ -n "${REMOTE_TAG}" && "${REMOTE_TAG}" != "${LOCAL_TAG}" ]]; then
            echo "Gitee tag ${TAG} already exists at a different object" >&2
            exit 1
          fi
          git -c http.postBuffer=1073741824 -c http.version=HTTP/1.1 \
            push --atomic gitee \
            "${TAG_COMMIT}:refs/heads/main" \
            "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Create and verify Gitee source release
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/publish_gitee_release.py \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --repository "${GITEE_REPOSITORY}" \
            --target-commitish "$(git rev-parse "${TAG}^{commit}")" \
            --assets-dir gitee-release-metadata \
            --source-metadata-only \
            --upload-transport urllib \
            --timeout 60
