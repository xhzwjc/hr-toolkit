name: Test Build (测试打包)

on:
  schedule:
    # Monday 02:00 Asia/Shanghai. Scheduled runs exercise the Windows package.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      platform:
        description: "选择打包平台 (Target Platform)"
        required: true
        default: "windows"
        type: choice
        options:
          - "windows"
          - "macos"
          - "all"
      run_tests:
        description: "打包前是否运行单元测试 (Run unit tests before packaging)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      target_platform: ${{ steps.meta.outputs.target_platform }}
      run_tests: ${{ steps.meta.outputs.run_tests }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'from hr_toolkit import __version__; print(__version__)')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            TARGET_PLATFORM="windows"
            RUN_TESTS="true"
          else
            TARGET_PLATFORM="${{ inputs.platform }}"
            RUN_TESTS="${{ inputs.run_tests }}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "target_platform=${TARGET_PLATFORM}" >> "${GITHUB_OUTPUT}"
          echo "run_tests=${RUN_TESTS}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${VERSION} (commit: ${SHORT_SHA})"
          echo "Target: ${TARGET_PLATFORM}; tests: ${RUN_TESTS}"

  build-windows:
    name: Build Windows (EXE & Portable ZIP)
    needs: prepare
    if: needs.prepare.outputs.target_platform == 'windows' || needs.prepare.outputs.target_platform == 'all'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install Python build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -c constraints/python312-production.txt
          python -m pip install --disable-pip-version-check -r requirements-build.txt -c constraints/python312-production.txt
          python -m pip check

      - name: Exercise local OCR models and inference
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test; ocr_runtime_smoke_test()"

      - name: Install Inno Setup and WiX
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run unit tests (Optional)
        if: needs.prepare.outputs.run_tests == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build Windows Application and Installers
        run: >-
          python scripts/release_windows.py
          --version "${{ env.VERSION }}"
          --build-dir dist/windows
          --output-dir artifacts/windows

      - name: Create Portable Zip (免安装绿色包)
        shell: pwsh
        run: |
          $zipPath = "artifacts/windows/HRToolkit_${env:VERSION}_test_${env:SHORT_SHA}_portable.zip"
          Compress-Archive -Path dist/windows/HRToolkit -DestinationPath $zipPath -Force
          Write-Host "Portable zip created at $zipPath"

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: HRToolkit-Windows-Test-${{ env.VERSION }}-${{ env.SHORT_SHA }}
          path: |
            artifacts/windows/HRToolkit_${{ env.VERSION }}_x64-setup.exe
            artifacts/windows/HRToolkit_${{ env.VERSION }}_x64.msi
            artifacts/windows/HRToolkit_${{ env.VERSION }}_test_${{ env.SHORT_SHA }}_portable.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.asset_suffix }} DMG
    needs: prepare
    if: needs.prepare.outputs.target_platform == 'macos' || needs.prepare.outputs.target_platform == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            asset_suffix: x64
          - runner: macos-15
            architecture: arm64
            asset_suffix: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints/python312-production.txt

      - name: Confirm native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install macOS build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt -c constraints/python312-production.txt
          python -m pip check

      - name: Exercise local OCR models and inference
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test; ocr_runtime_smoke_test()"

      - name: Run unit tests (Optional)
        if: needs.prepare.outputs.run_tests == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_macos.py \
            --version "${VERSION}" \
            --architecture "${{ matrix.architecture }}" \
            --output-dir artifacts/macos

      - name: Upload macOS test artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: HRToolkit-macOS-${{ matrix.asset_suffix }}-Test-${{ env.VERSION }}-${{ env.SHORT_SHA }}
          path: artifacts/macos/HRToolkit_${{ env.VERSION }}_${{ matrix.asset_suffix }}.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
