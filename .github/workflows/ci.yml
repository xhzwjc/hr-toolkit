name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python 3.12 dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked production and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -c constraints/python312-production.txt
          python -m pip install --disable-pip-version-check -r requirements-build.txt -c constraints/python312-production.txt
          python -m pip install --disable-pip-version-check -r requirements-audit.txt -c constraints/python312-production.txt
          python -m pip check

      - name: Reject known dependency vulnerabilities
        run: python -m pip_audit --local --progress-spinner off

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            python -m pip install --disable-pip-version-check --upgrade \
              -c constraints/python312-production.txt pip
            python -m pip install --disable-pip-version-check \
              -r requirements.txt \
              -c constraints/python312-production.txt
          else
            # pip 26 no longer supports Python 3.9; use its newest compatible installer.
            python -m pip install --disable-pip-version-check --upgrade "pip==25.3"
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hr-toolkit-pycache
        run: python -m compileall -q -f hr_toolkit scripts tests hr_toolkit_app.py hr_toolkit_qt_app.py hr_toolkit_updater.py

      - name: Check whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  windows-test:
    name: Windows Python 3.12
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-gui.txt -c constraints/python312-production.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Exercise local OCR models and inference
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test; ocr_runtime_smoke_test()"

      - name: Exercise Qt Quick front end
        env:
          HR_TOOLKIT_SKIP_UPDATE: "1"
          HR_TOOLKIT_QT_SMOKE_EXIT_MS: "800"
        run: python hr_toolkit_app.py --qt-smoke-test

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hr-toolkit-pycache
        run: python -m compileall -q -f hr_toolkit scripts tests hr_toolkit_app.py hr_toolkit_qt_app.py hr_toolkit_updater.py

  windows-win7-compat-test:
    name: Windows 7 compatibility stack on Python 3.8
    # Keep the frozen Python 3.8/PySide2 stack off Windows Server 2025.
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      HR_TOOLKIT_7ZIP_EXE: ${{ github.workspace }}\build\win7-runtime\7zip\7z.exe
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.8 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-win7.txt
            requirements-gui.txt
            constraints/python38-win7.txt

      - name: Install frozen Win7 dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==25.0.1"
          python -m pip install --disable-pip-version-check -r requirements-win7.txt -r requirements-gui.txt -c constraints/python38-win7.txt
          python -m pip check

      - name: Prepare pinned Win7 runtimes
        run: python scripts/prepare_win7_runtime.py --output-dir build/win7-runtime

      - name: Exercise OCR and archive runtimes
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test, smoke_test; ocr_runtime_smoke_test(); smoke_test()"

      - name: Exercise Win7 Qt Quick runtime on Windows runner
        env:
          HR_TOOLKIT_SKIP_UPDATE: "1"
          HR_TOOLKIT_QT_SMOKE_EXIT_MS: "800"
          # Use the native window path without requiring a hosted runner GPU.
          # The production QML and signal connections are still exercised.
          QT_QPA_PLATFORM: "windows"
          QT_QUICK_BACKEND: "software"
          QSG_RENDER_LOOP: "basic"
        shell: pwsh
        run: |
          # Require all three launches to succeed; do not retry a crash.
          for ($launch = 1; $launch -le 3; $launch++) {
            python hr_toolkit_app.py --qt-smoke-test
            if ($LASTEXITCODE -ne 0) {
              throw "Win7 Qt startup $launch/3 failed with exit code $LASTEXITCODE"
            }
          }

      - name: Run Python 3.8-compatible core tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest -v
          tests.test_archive_import
          tests.test_data_statistics
          tests.test_project_store
          tests.test_runtime_checks
          tests.test_salary_merge
          tests.test_salary_split
          tests.test_social_security
          tests.test_tool_registry
          tests.test_paths
          tests.test_pdf_backend_compat
          tests.test_release_metadata
          tests.test_background_process
          tests.test_qt_controller
          tests.test_qt_entrypoint
          tests.test_qt_form_specs
          tests.test_run_coordinator

      - name: Compile Python sources under Python 3.8
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hr-toolkit-pycache-win7
        run: python -m compileall -q -f hr_toolkit scripts hr_toolkit_app.py hr_toolkit_qt_app.py hr_toolkit_updater.py
