name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python 3.12 dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked production and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -c constraints/python312-production.txt
          python -m pip install --disable-pip-version-check -r requirements-build.txt -c constraints/python312-production.txt
          python -m pip install --disable-pip-version-check -r requirements-audit.txt -c constraints/python312-production.txt
          python -m pip check

      - name: Reject known dependency vulnerabilities
        run: python -m pip_audit --local --progress-spinner off

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            python -m pip install --disable-pip-version-check --upgrade \
              -c constraints/python312-production.txt pip
            python -m pip install --disable-pip-version-check \
              -r requirements.txt \
              -c constraints/python312-production.txt
          else
            # pip 26 no longer supports Python 3.9; use its newest compatible installer.
            python -m pip install --disable-pip-version-check --upgrade "pip==25.3"
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hr-toolkit-pycache
        run: python -m compileall -q -f hr_toolkit scripts tests hr_toolkit_app.py hr_toolkit_updater.py

      - name: Check whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  windows-test:
    name: Windows Python 3.12
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -c constraints/python312-production.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Exercise local OCR models and inference
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test; ocr_runtime_smoke_test()"

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hr-toolkit-pycache
        run: python -m compileall -q -f hr_toolkit scripts tests hr_toolkit_app.py hr_toolkit_updater.py
